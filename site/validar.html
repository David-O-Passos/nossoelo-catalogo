<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Conferir planilha — NOSSO.ELO</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="pagina-admin">

<header class="topo-admin">
  <div class="marca">
    <h1>Nosso<span>.</span>Elo</h1>
    <p class="lema">Conferir planilha</p>
  </div>
</header>

<main class="painel-admin largo">
  <p>Abra esta página depois de atualizar a planilha para ver se ficou tudo certo.</p>
  <button id="conferir" class="botao-enviar" type="button">Conferir agora</button>
  <div id="saida" aria-live="polite"></div>
</main>

<script type="module">
import { parseCSV } from './js/csv.js';
import { analisar } from './js/validador.js';
import { URL_PLANILHA } from './js/config.js';

const $ = (s) => document.querySelector(s);
const botao = $('#conferir');
const saida = $('#saida');

/** Escapa texto vindo da planilha antes de virar HTML. */
function escapar(texto) {
  return String(texto ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function mostrarSpinner(ligado) {
  botao.disabled = ligado;
  botao.innerHTML = ligado
    ? '<span class="spinner" aria-hidden="true"></span>Conferindo…'
    : 'Conferir agora';
}

function bloco(numero, rotulo) {
  return `<div class="bloco-resumo"><span class="numero">${numero}</span><span class="rotulo">${escapar(rotulo)}</span></div>`;
}

botao.addEventListener('click', async () => {
  mostrarSpinner(true);
  saida.innerHTML = '';
  try {
    const resposta = await fetch(URL_PLANILHA + '&t=' + Date.now());
    if (!resposta.ok) {
      throw new Error('a planilha respondeu ' + resposta.status);
    }
    const texto = await resposta.text();

    // fetch nao rejeita em erro de HTTP, entao uma pagina de erro em HTML
    // chegaria aqui como texto e seria lida como CSV — inventando erros numa
    // pagina cuja unica serventia e ser confiavel. Confere o cabecalho antes.
    const cabecalho = (texto.split('\n')[0] || '').toLowerCase();
    if (!cabecalho.includes('id') || !cabecalho.includes('preco_por')) {
      throw new Error('a resposta nao parece a planilha de produtos');
    }

    const linhas = parseCSV(texto);

    // O navegador nao lista pastas. Duas fontes se complementam:
    // lista.json (gerada na migracao) permite achar imagens orfas;
    // o teste HEAD confirma, imagem a imagem, o que realmente existe hoje.
    let doManifesto = [];
    try {
      doManifesto = await (await fetch('img/lista.json?t=' + Date.now())).json();
    } catch { doManifesto = []; }

    const referenciadas = [...new Set(linhas.map((l) => (l.imagem || '').trim()).filter(Boolean))];
    const existentes = [];
    for (let i = 0; i < referenciadas.length; i += 20) {
      const lote = referenciadas.slice(i, i + 20);
      const respostas = await Promise.all(lote.map((nome) =>
        fetch('img/' + nome, { method: 'HEAD' })
          .then((r) => (r.ok ? nome : null))
          .catch(() => null)));
      existentes.push(...respostas.filter(Boolean));
    }

    const r = analisar(linhas, [...new Set([...existentes, ...doManifesto])]);

    const listaErros = r.erros
      .map((e) => `<li>Linha ${e.linha} — ${escapar(e.motivo)}</li>`)
      .join('');

    const mostrarAvisos = r.avisos.slice(0, 50);
    const restoAvisos = r.avisos.length - mostrarAvisos.length;
    const listaAvisos = mostrarAvisos.map((a) => `<li>${escapar(a)}</li>`).join('')
      + (restoAvisos > 0 ? `<li>e mais ${restoAvisos} avisos</li>` : '');

    saida.innerHTML = `
      <div class="resumo-blocos">
        ${bloco(r.resumo.total, 'Produtos na planilha')}
        ${bloco(r.resumo.ativos, 'No ar')}
        ${bloco(r.resumo.inativos, 'Inativos')}
        ${bloco(r.resumo.semImagem, 'Sem foto')}
      </div>

      <section class="secao-admin">
        <h2>Erros (${r.erros.length})</h2>
        ${listaErros
          ? `<ul class="lista-erros">${listaErros}</ul>`
          : '<p class="texto-vazio">Nenhum erro. Está tudo certo.</p>'}
      </section>

      <section class="secao-admin">
        <h2>Avisos (${r.avisos.length})</h2>
        ${listaAvisos
          ? `<ul class="lista-avisos">${listaAvisos}</ul>`
          : '<p class="texto-vazio">Nenhum aviso.</p>'}
      </section>`;
  } catch (e) {
    const div = document.createElement('div');
    div.className = 'resultado erro';
    const p = document.createElement('p');
    p.textContent = 'Não consegui ler a planilha: ' + e.message;
    div.appendChild(p);
    saida.replaceChildren(div);
  } finally {
    mostrarSpinner(false);
  }
});
</script>
</body>
</html>
